<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FocusX Forgot Password</title>

  <!-- CSS -->
  <link rel="stylesheet" href="forgetpassword.css">

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="container">

    <!-- LEFT IMAGE -->
    <div class="left-side">
      <img src="images/forget.png" alt="hero-img">
    </div>

    <!-- RIGHT SIDE -->
    <div class="right-side">

      <div class="form">

        <!-- MAIL IMAGE -->
        <img src="images/lock.png" class="mail-icon" alt="">

        <h1>Forgot Password?</h1>

        <p class="subtitle">
          Enter your email and we’ll send you
          a link to reset your password.
        </p>

        <!-- INPUT -->
        <div class="input-box">

          <!-- MAIL SVG -->
          <svg xmlns="http://www.w3.org/2000/svg"
          fill="none" viewBox="0 0 24 24"
          stroke-width="1.8" stroke="currentColor">

            <path stroke-linecap="round"
            stroke-linejoin="round"
            d="M21.75 7.5v9A2.25 2.25 0 0119.5 18.75h-15A2.25 2.25 0 012.25 16.5v-9m19.5 
            0A2.25 2.25 0 0019.5 5.25h-15A2.25 2.25 0 002.25 7.5m19.5 
            0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 
            4.615a2.25 2.25 0 01-2.36 0l-7.5-4.615A2.25 
            2.25 0 012.25 7.743V7.5"/>

          </svg>

          <input type="email" placeholder="Enter your email address">

        </div>

        <!-- BUTTON -->
        <button class="reset-btn">
          Send Reset Link →
        </button>

        <!-- BOTTOM -->
        <div class="bottom-text">
          Remember your password?
          <a href="./login.html">Log in</a>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
