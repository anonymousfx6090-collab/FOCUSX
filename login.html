<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOCUS || login page
    </title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-page-layout">
        <figure class="img-container">
            <img class="hero-img" src="images/login-img-2.png" alt="Login page background illustration">
        </figure>
        <section class="form-container">
            <article class="form">
                <h1>Sign in</h1>
                <p>Welcome back! please sign in to continue.</p>
                <form action="sign in" method="POST">
                    <fieldset>
                        <div>
                            <label for="email">Email</label>
                            <div class="input-container">
                                <span class="mail" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                                        height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                        class="lucide lucide-mail-icon lucide-mail">
                                        <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
                                        <rect x="2" y="4" width="20" height="16" rx="2" />
                                    </svg></span>
                                <input type="email" id="email" placeholder="Enter your email" required>
                            </div>
                        </div>
                        <div>
                            <label for="password">Password</label>
                            <div class="input-container">
                                <span class="padlock" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg"
                                        width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                        class="lucide lucide-lock-keyhole-icon lucide-lock-keyhole">
                                        <circle cx="12" cy="16" r="1" />
                                        <rect x="3" y="10" width="18" height="12" rx="2" />
                                        <path d="M7 10V7a5 5 0 0 1 10 0v3" />
                                    </svg></span>
                                <input type="password" id="password" placeholder="Enter your password" required>
                                <span class="eye" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                                        height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                        class="lucide lucide-eye-icon lucide-eye">
                                        <path
                                            d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                        <circle cx="12" cy="12" r="3" />
                                    </svg></span>
                            </div>
                            <div class="remember-me-container">
                                <label class="custom-checkbox">
                                    <input type="checkbox" id="checked">
                                    <span class="checkmark"></span>
                                    Remember me
                                </label>
                                <div class="forgot-password">
                                    <a href="#">Forgot password?</a>
                                </div>
                            </div>
                            <button class="login-button" type="submit">Sign in</button>
                            <div class="line-container">
                                <div class="line"></div>
                                <div class="or">Or continue with</div>
                                <div class="line"></div>
                            </div>
                            <div class="other-options-container">
                                <div class="google-container">
                                    <div>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="2443" height="2500"
                                            preserveAspectRatio="xMidYMid" viewBox="0 0 256 262" id="google">
                                            <path fill="#4285F4"
                                                d="M255.878 133.451c0-10.734-.871-18.567-2.756-26.69H130.55v48.448h71.947c-1.45 12.04-9.283 30.172-26.69 42.356l-.244 1.622 38.755 30.023 2.685.268c24.659-22.774 38.875-56.282 38.875-96.027">
                                            </path>
                                            <path fill="#34A853"
                                                d="M130.55 261.1c35.248 0 64.839-11.605 86.453-31.622l-41.196-31.913c-11.024 7.688-25.82 13.055-45.257 13.055-34.523 0-63.824-22.773-74.269-54.25l-1.531.13-40.298 31.187-.527 1.465C35.393 231.798 79.49 261.1 130.55 261.1">
                                            </path>
                                            <path fill="#FBBC05"
                                                d="M56.281 156.37c-2.756-8.123-4.351-16.827-4.351-25.82 0-8.994 1.595-17.697 4.206-25.82l-.073-1.73L15.26 71.312l-1.335.635C5.077 89.644 0 109.517 0 130.55s5.077 40.905 13.925 58.602l42.356-32.782">
                                            </path>
                                            <path fill="#EB4335"
                                                d="M130.55 50.479c24.514 0 41.05 10.589 50.479 19.438l36.844-35.974C195.245 12.91 165.798 0 130.55 0 79.49 0 35.393 29.301 13.925 71.947l42.211 32.783c10.59-31.477 39.891-54.251 74.414-54.251">
                                            </path>
                                        </svg>
                                    </div>
                                    Google
                                </div>
                                <div class="apple-container">
                                    <div><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="apple">
                                            <path
                                                d="M14.94,5.19A4.38,4.38,0,0,0,16,2,4.44,4.44,0,0,0,13,3.52,4.17,4.17,0,0,0,12,6.61,3.69,3.69,0,0,0,14.94,5.19Zm2.52,7.44a4.51,4.51,0,0,1,2.16-3.81,4.66,4.66,0,0,0-3.66-2c-1.56-.16-3,.91-3.83.91s-2-.89-3.3-.87A4.92,4.92,0,0,0,4.69,9.39C2.93,12.45,4.24,17,6,19.47,6.8,20.68,7.8,22.05,9.12,22s1.75-.82,3.28-.82,2,.82,3.3.79,2.22-1.24,3.06-2.45a11,11,0,0,0,1.38-2.85A4.41,4.41,0,0,1,17.46,12.63Z">
                                            </path>
                                        </svg></div>
                                    <div>Apple</div>
                                </div>
                            </div>
                            <div class="sign-up">Dont have an account? <a href="./sign-up.html">sign up</a></div>
                            <a href="/index.html" class="home">GO HOME </a>
                        </div>
                </form>
    </div>
    </div>
    </div>
</body>

</html>
